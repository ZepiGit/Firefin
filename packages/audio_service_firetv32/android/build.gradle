group = "com.ryanheise.audioservice"
version "1.0-SNAPSHOT"
def args = ["-Xlint:deprecation","-Xlint:unchecked"]

buildscript {
    ext {
        agp_version = '8.7.3'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile) {
    options.compilerArgs.addAll(args)
}

apply plugin: "com.android.library"

android {
    namespace "com.ryanheise.audioservice"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    defaultConfig {
        minSdk = 19
    }
    sourceSets {
        // TV mode never initializes AudioService (media_kit owns foreground
        // playback), so avoid the AndroidX MediaBrowser dependency on Fire OS 5.
        main.java.srcDirs = ['src/firetv/java']
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {}
