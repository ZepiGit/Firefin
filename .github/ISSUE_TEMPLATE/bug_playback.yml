name: "Bug: Playback"
description: Report a video/audio playback issue
title: "[Playback] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out as much as you can, playback issues are very environment + media dependent.

  - type: input
    id: app_version
    attributes:
      label: Firefin version
      description: Shown in Settings → About Firefin, or the release tag (e.g. 0.2.5-firefin)
      placeholder: 0.2.5-firefin
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Fire TV Stick 2nd Generation (AFTT)
        - Fire TV Stick Basic Edition (LY73PR)
        - Fire TV Stick 1st Generation
        - Other Fire TV device
        - Other Android TV / Android 5+ device
    validations:
      required: true

  - type: input
    id: platform_version
    attributes:
      label: Fire OS / Android version
      description: "Settings → Device → About, e.g. Fire OS 5.2.9.5 (Android 5.1)"
      placeholder: Fire OS 5.2.9.5
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model code
      description: "Settings → Device → About, e.g. AFTT"
    validations:
      required: false

  - type: input
    id: server_version
    attributes:
      label: Jellyfin server version
      description: "Dashboard → About, e.g. Jellyfin 10.10.7"
      placeholder: Jellyfin 10.x.x
    validations:
      required: true

  - type: dropdown
    id: item_type
    attributes:
      label: Content type
      options:
        - Movie
        - Episode
        - Other video
    validations:
      required: true

  - type: textarea
    id: media_info
    attributes:
      label: Media details (as much as you know, e.g. from the media info in the Jellyfin web interface)
      description: Container, resolution, HDR type, video codec/profile, audio codec/channels, subtitle type, bitrate
      placeholder: |
        Container: MKV
        Resolution: 1920x1080
        Video: H.264 High@L4.1
        Audio: AC3 5.1
        Subs: SRT (external)
        Bitrate: ~8 Mbps
    validations:
      required: true

  - type: dropdown
    id: playback_path
    attributes:
      label: Playback path
      options:
        - Direct Play
        - Transcode
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms (check all that apply)
      options:
        - label: Black screen / endless spinner
        - label: Audio only (no video)
        - label: Stuttering / frame drops
        - label: A/V sync issues
        - label: Seeking/scrubbing broken
        - label: Subtitles missing or incorrect
        - label: Unexpected forced transcode
        - label: App crashes / exits

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press Play ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / errors (optional)
      description: Paste any on-screen errors, console output, or attach screenshots.
    validations:
      required: false
