name: "Bug: UI"
description: Report a UI/UX issue (navigation, screens, layout, etc.)
title: "[UI] "
labels: ["bug"]
body:
  - type: input
    id: app_version
    attributes:
      label: Firefin version
      description: Shown in Settings → About Firefin, or the release tag (e.g. 0.2.5-firefin)
      placeholder: 0.2.5-firefin
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Fire TV Stick 2nd Generation (AFTT)
        - Fire TV Stick Basic Edition (LY73PR)
        - Fire TV Stick 1st Generation
        - Other Fire TV device
        - Other Android TV / Android 5+ device
    validations:
      required: true

  - type: input
    id: platform_version
    attributes:
      label: Fire OS / Android version
      description: "Settings → Device → About, e.g. Fire OS 5.2.9.5 (Android 5.1)"
      placeholder: Fire OS 5.2.9.5
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model code
      description: "Settings → Device → About, e.g. AFTT"
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Where does it happen?
      options:
        - Login
        - Home
        - Details page
        - Settings
        - Search
        - Library
        - Player UI (controls/OSD)
        - Media requests (Seerr)
        - Other
    validations:
      required: true

  - type: dropdown
    id: input_method
    attributes:
      label: Input method
      options:
        - Fire TV remote
        - Other remote / game controller
        - Keyboard or mouse
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings (optional)
      description: Attach a screenshot or screen recording if it helps.
    validations:
      required: false
