name: "Bug: Seerr"
description: Report a Seerr integration issue
title: "[Seerr] "
labels: ["bug"]
body:
  - type: input
    id: app_version
    attributes:
      label: Firefin version
      description: Shown in Settings → About Firefin, or the release tag (e.g. 0.2.5-firefin)
      placeholder: 0.2.5-firefin
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Fire TV Stick 2nd Generation (AFTT)
        - Fire TV Stick Basic Edition (LY73PR)
        - Fire TV Stick 1st Generation
        - Other Fire TV device
        - Other Android TV / Android 5+ device
    validations:
      required: true

  - type: input
    id: platform_version
    attributes:
      label: Fire OS / Android version
      description: "Settings → Device → About, e.g. Fire OS 5.2.9.5 (Android 5.1)"
      placeholder: Fire OS 5.2.9.5
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model code
      description: "Settings → Device → About, e.g. AFTT"
    validations:
      required: false

  - type: input
    id: connection_type
    attributes:
      label: Moonbase and Jellyfin versions
      description: Firefin reaches Seerr through the Moonbase plugin on the Jellyfin server.
      placeholder: Moonbase 2.x / Jellyfin 10.x.x
    validations:
      required: true

  - type: dropdown
    id: https
    attributes:
      label: Is the Jellyfin address HTTPS?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message / what happens
      placeholder: |
        "Failed to connect..." / spinner / auth loop / blank page / etc.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: dropdown
    id: works_elsewhere
    attributes:
      label: Does Seerr work from a phone/PC browser on the same network?
      options:
        - "Yes"
        - "No"
        - "Haven't tried"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / extra context (optional)
    validations:
      required: false
