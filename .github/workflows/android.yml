name: Native Android CI

# Firefin native Kotlin pipeline. No Flutter, no desktop/mobile packaging:
# this repo ships one Android/Fire-TV app for API 22-class devices
# (minSdk 21 kept for install compatibility; runtime target is Fire OS 5.2.8.0).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'firefin/**', 'repair/**']
    tags: ['v*']

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-test:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (incl. NewApi against minSdk 21)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Assemble release (R8 check, unsigned unless secrets configured)
        env:
          FIREFIN_KEYSTORE_FILE: ${{ secrets.FIREFIN_KEYSTORE_FILE }}
          FIREFIN_KEYSTORE_PASSWORD: ${{ secrets.FIREFIN_KEYSTORE_PASSWORD }}
          FIREFIN_KEY_ALIAS: ${{ secrets.FIREFIN_KEY_ALIAS }}
          FIREFIN_KEY_PASSWORD: ${{ secrets.FIREFIN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: firefin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: firefin-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release
        env:
          FIREFIN_KEYSTORE_FILE: ${{ secrets.FIREFIN_KEYSTORE_FILE }}
          FIREFIN_KEYSTORE_PASSWORD: ${{ secrets.FIREFIN_KEYSTORE_PASSWORD }}
          FIREFIN_KEY_ALIAS: ${{ secrets.FIREFIN_KEY_ALIAS }}
          FIREFIN_KEY_PASSWORD: ${{ secrets.FIREFIN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename artifact
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "Firefin_${VERSION}.apk"

      - name: Verify APK identity
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          ANDROID_HOME="$RUNNER_ANDROID_HOME" || true
          aapt2 dump badging "Firefin_${VERSION}.apk" | tee badging.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Firefin_*.apk
          generate_release_notes: true
