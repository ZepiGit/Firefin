name: Legacy Flutter baseline (validation only)

on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/**', 'packages/**', 'android/**', 'test/**', 'pubspec.*', 'build-android.sh', '.github/workflows/build.yml']
  push:
    branches: [main, 'firefin/**']
    paths: ['lib/**', 'packages/**', 'android/**', 'test/**', 'pubspec.*', 'build-android.sh', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Run legacy tests
        run: flutter test
      - name: Build legacy validation APK (never published)
        run: bash ./build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-validation-only-${{ github.sha }}
          path: Moonfin_FireTV32_Unofficial_*.apk
          if-no-files-found: error
